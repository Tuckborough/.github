name: 🐛 Bug Report
description: Report a reproducible defect or error in Cleva applications.
title: "Bug: [Concise summary of the problem]"
labels: ["type:bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### Bug / Defect Report
        Please provide reproducible steps and environment details.

  - type: dropdown
    id: severity
    attributes:
      label: Severity Level
      options:
        - "priority:P0-blocker (App crash, data loss, security exposure)"
        - "priority:P1-high (Core feature broken, no workaround)"
        - "priority:P2-medium (Feature partially impaired, workaround exists)"
        - "priority:P3-low (Cosmetic, typo, minor visual glitch)"
    validations:
      required: true

  - type: dropdown
    id: affected_component
    attributes:
      label: Affected Component
      options:
        - "Web Application (cleva-web)"
        - "iOS Application (cleva-ios)"
        - "Android Application (cleva-android)"
        - "Backend API / Database (cleva-backend)"
        - "DevSecOps / CI Pipeline (cleva-devops)"
        - "Documentation / Specs (cleva-docs)"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment & Device Details
      placeholder: |
        - OS: Windows 11 / macOS Sonoma / iOS 17.5 / Android 14
        - Browser / Client: Chrome 124 / Safari / Native App
        - App Version / Commit: v0.2.1 / commit hash
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Navigate to Brief view
        2. Click on 'Alertes Centris' badge
        3. Observe loading spinner never resolves
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected vs Actual Behavior
      placeholder: |
        - **Expected:** Listing alerts load within 2 seconds.
        - **Actual:** Request times out with a 504 error.
    validations:
      required: true

  - type: textarea
    id: error_logs
    attributes:
      label: Error Logs / Stack Trace / Screenshots
      description: Paste relevant logs or upload screenshots (make sure NO private client PII or tokens are visible).
